name: Release

'on':
  push:
    branches: [main]
    paths: [app/build.gradle.kts]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the APK without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check Android version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          read_version() {
            python3 -c '
          import re
          import sys

          assignment = r"""^[ \t]*versionName[ \t]*=[ \t]*"([^"\r\n]+)"[ \t]*(?://[^\r\n]*)?$"""
          matches = re.findall(assignment, sys.stdin.read(), re.MULTILINE)
          if len(matches) != 1:
              sys.exit("Expected one literal versionName in app/build.gradle.kts")
          print(matches[0])
          '
          }

          version_file=app/build.gradle.kts
          version=$(read_version < "$version_file")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid Android versionName: $version"
            exit 1
          fi

          tag="v$version"
          is_prerelease=false
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          fi

          should_release=true
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$DRY_RUN" == true ]]; then
            echo "Dry run for $tag."
            should_release=false
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists. Skipping release."
            should_release=false
          elif [[ "$?" != 2 ]]; then
            echo "::error::Could not check for tag $tag on origin."
            exit 1
          elif [[ "$GITHUB_EVENT_NAME" == push && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            previous_version=$(git show "$BEFORE_SHA:$version_file" | read_version)
            if [[ "$previous_version" == "$version" ]]; then
              echo "Version unchanged ($version). Skipping release."
              should_release=false
            fi
          fi

          {
            echo "should_release=$should_release"
            echo "version=$version"
            echo "tag=$tag"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build Android APK
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lyra-android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Stage APK
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          mkdir -p dist-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "dist-artifacts/Lyra-Android-${VERSION}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lyra-android-apk
          path: dist-artifacts/*.apk
          if-no-files-found: error

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lyra-android-apk
          path: release-assets

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum --binary -- *.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.check-version.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ needs.check-version.outputs.is_prerelease == 'true' }}
          draft: false
          fail_on_unmatched_files: true
